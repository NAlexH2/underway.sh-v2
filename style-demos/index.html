<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>underway.sh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    /* Dark "night sea-chart" palette */
    --parchment: rgb(11,21,35);        /* page background */
    --parchment-deep: rgb(14,26,42);   /* darker surface / gradient tail */
    --parchment-light: rgb(22,37,58);  /* card / panel surface */
    --paper: rgb(233,219,198);         /* light ink for text ON accent fills */
    --ink: rgb(216,201,180);           /* body text (warm cream) */
    --ink-soft: rgb(170,160,145);      /* secondary text */
    --navy: rgb(236,223,201);          /* headings / wordmark / hairlines (bright cream) */
    --jade: rgb(122,184,152);          /* accent */
    --jade-deep: rgb(140,198,164);     /* links (lightened so they read on navy) */
    --line: rgba(214,199,178,0.17);
    --line-soft: rgba(214,199,178,0.09);
    --rope: rgb(198,158,108);          /* brass */
  }

  *{box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    margin:0;
    font-family:"EB Garamond", Georgia, serif;
    font-size:19px;
    line-height:1.7;
    color:var(--ink);
    background-color:var(--parchment);
    /* Sea-chart bathymetry contour lines + faint compass wash */
    background-image:
      radial-gradient(circle at 78% 16%, rgba(140,198,164,0.16) 0 1px, transparent 2px),
      repeating-radial-gradient(circle at 78% 16%, transparent 0 34px, rgba(214,199,178,0.05) 34px 35px, transparent 35px 70px),
      repeating-radial-gradient(circle at 12% 88%, transparent 0 46px, rgba(122,184,152,0.06) 46px 47px, transparent 47px 94px),
      radial-gradient(ellipse at 20% 10%, rgba(122,184,152,0.05), transparent 60%),
      radial-gradient(ellipse at 50% 120%, rgba(0,0,0,0.35), transparent 70%);
    background-attachment: fixed;
    -webkit-font-smoothing:antialiased;
  }

  a{
    color:var(--jade-deep);
    text-decoration:none;
    border-bottom:1px dotted var(--jade);
    padding-bottom:1px;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  a:hover{
    color:var(--navy);
    border-bottom:1px solid var(--navy);
    background:rgba(85,132,109,0.10);
  }

  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:0 26px 90px;
  }

  /* ---------- Header ---------- */
  header.masthead{
    position:sticky;
    top:0;
    z-index:20;
    background:linear-gradient(var(--parchment-light), var(--parchment-deep));
    border-bottom:2px solid var(--navy);
    box-shadow:0 2px 0 rgba(168,130,86,0.5), 0 6px 18px rgba(20,44,74,0.10);
  }
  .masthead-inner{
    max-width:820px;
    margin:0 auto;
    padding:14px 26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .wordmark{
    font-family:"Spectral", serif;
    font-weight:600;
    font-size:1.5rem;
    letter-spacing:.06em;
    color:var(--navy);
    border:none;
    display:inline-flex;
    align-items:center;
    gap:.55rem;
    padding:0;
  }
  .wordmark:hover{background:none;color:var(--jade-deep);}
  .wordmark .rose{
    width:1.15em;height:1.15em;flex:0 0 auto;
    border-radius:50%;
    background:
      conic-gradient(from 0deg, var(--navy) 0 8deg, transparent 8deg 82deg,
        var(--jade) 82deg 98deg, transparent 98deg 172deg,
        var(--navy) 172deg 188deg, transparent 188deg 262deg,
        var(--jade) 262deg 278deg, transparent 278deg 352deg,
        var(--navy) 352deg 360deg);
    border:1.5px solid var(--navy);
    position:relative;
  }
  .wordmark .rose::after{
    content:"";position:absolute;inset:28%;
    border-radius:50%;
    background:var(--parchment-light);
    border:1px solid var(--jade);
  }
  nav.nav{
    display:flex;
    gap:22px;
    font-family:"Spectral", serif;
    font-size:.98rem;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  nav.nav a{
    border-bottom:1px solid transparent;
    color:var(--ink-soft);
    padding-bottom:2px;
  }
  nav.nav a:hover{
    color:var(--navy);
    border-bottom:1px solid var(--jade);
    background:none;
  }

  /* ---------- Section scaffolding ---------- */
  section{padding-top:30px;}
  .kicker{
    font-family:"Spectral", serif;
    text-transform:uppercase;
    letter-spacing:.28em;
    font-size:.72rem;
    color:var(--jade-deep);
    margin:0 0 6px;
    display:flex;
    align-items:center;
    gap:.6em;
  }
  .kicker::after{
    content:"";flex:1;height:0;
    border-top:2px dotted var(--line);
  }
  h1,h2,h3{font-family:"Spectral", serif; color:var(--navy); font-weight:600; line-height:1.2;}
  h1{font-size:3.1rem; margin:.1em 0 .5em;}
  h2{font-size:1.85rem; margin:.1em 0 .5em;}
  h3{font-size:1.3rem; margin:0 0 .15em;}

  /* Rope / chart-route divider */
  .rope-divider{
    height:14px;
    margin:44px 0;
    border:none;
    background:
      repeating-linear-gradient(90deg,
        var(--rope) 0 9px,
        rgba(168,130,86,0.35) 9px 12px,
        var(--rope) 12px 21px,
        transparent 21px 24px);
    -webkit-mask:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    mask:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    opacity:.75;
    border-radius:7px;
  }
  .wave-divider{
    height:16px;margin:40px 0;border:none;
    background-image:radial-gradient(circle at 10px -6px, transparent 12px, var(--jade) 12px 13px, transparent 14px);
    background-size:20px 16px;
    opacity:.5;
    -webkit-mask:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
    mask:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  }

  p{margin:0 0 1.05em;}
  p:last-child{margin-bottom:0;}

  /* ---------- Bio ---------- */
  .bio-head{display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
  .avatar{
    width:132px;height:132px;flex:0 0 auto;
    border-radius:50%;
    display:grid;place-items:center;
    font-family:"Spectral", serif;
    font-weight:600;
    font-size:2rem;
    color:transparent;
    background:url("headshot.jpg") center/cover no-repeat, radial-gradient(circle at 32% 28%, var(--jade) 0%, var(--parchment) 82%);
    border:3px double var(--paper);
    box-shadow:0 0 0 2px rgba(198,158,108,0.55), 0 4px 16px rgba(0,0,0,0.45);
    letter-spacing:.03em;
  }
  .bio-head h1{margin:0;}

  .logline{
    background:linear-gradient(var(--parchment-light), var(--parchment-deep));
    border:1px solid var(--line);
    border-left:4px solid var(--jade);
    padding:20px 24px;
    border-radius:4px;
    margin-top:18px;
    box-shadow:0 2px 10px rgba(20,44,74,0.06);
  }

  /* Present / Before intro headings */
  .stage-head{
    font-family:"Spectral", serif;
    font-weight:600;
    color:var(--navy);
    font-size:1.05rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin:0 0 .4em;
    display:inline-block;
    border-bottom:2px solid var(--jade);
    padding-bottom:3px;
  }
  .outro-line{
    margin-top:1.1em;
    font-style:italic;
    color:var(--ink-soft);
    padding-left:16px;
    border-left:3px dotted var(--rope);
  }

  /* ---------- Experience cards ---------- */
  .card{
    background:linear-gradient(180deg, var(--parchment-light), var(--parchment-deep));
    border:1px solid var(--line);
    border-radius:6px;
    padding:22px 24px;
    margin-bottom:22px;
    box-shadow:0 3px 12px rgba(20,44,74,0.07);
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute;left:0;top:14px;bottom:14px;width:3px;
    background:var(--jade);
    border-radius:3px;
  }
  .card-top{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:14px;flex-wrap:wrap;
    margin-bottom:.5em;
  }
  .card .subtitle{
    font-style:italic;color:var(--jade-deep);font-size:1.05em;
  }
  .dates{
    font-family:"Spectral", serif;
    font-size:.8rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    white-space:nowrap;
    background:rgba(214,199,178,0.08);
    border:1px solid var(--line-soft);
    padding:3px 10px;
    border-radius:20px;
  }
  .card ul{
    margin:.6em 0 0;
    padding-left:0;
    list-style:none;
  }
  .card li{
    position:relative;
    padding-left:26px;
    margin-bottom:.7em;
    font-size:1em;
    line-height:1.6;
  }
  .card li:last-child{margin-bottom:0;}
  .card li::before{
    content:"";
    position:absolute;left:4px;top:.62em;
    width:8px;height:8px;
    border:1.5px solid var(--jade-deep);
    border-radius:50%;
    background:radial-gradient(circle at center, var(--jade) 40%, transparent 42%);
  }

  /* ---------- Projects ---------- */
  .featured{
    background:linear-gradient(180deg, var(--parchment-light), var(--parchment-deep));
    border:1px solid rgba(198,158,108,0.5);
    border-radius:8px;
    padding:26px 26px 24px;
    box-shadow:0 4px 20px rgba(20,44,74,0.12);
    position:relative;
    overflow:hidden;
  }
  .featured::after{
    /* faint compass rose in corner */
    content:"";
    position:absolute;right:-40px;top:-40px;width:150px;height:150px;
    border-radius:50%;
    background:
      conic-gradient(from 45deg, transparent 0 20deg, rgba(85,132,109,0.10) 20deg 25deg, transparent 25deg 65deg,
        rgba(20,44,74,0.08) 65deg 70deg, transparent 70deg 110deg,
        rgba(85,132,109,0.10) 110deg 115deg, transparent 115deg 155deg,
        rgba(20,44,74,0.08) 155deg 160deg, transparent 160deg 200deg,
        rgba(85,132,109,0.10) 200deg 205deg, transparent 205deg 245deg,
        rgba(20,44,74,0.08) 245deg 250deg, transparent 250deg 290deg,
        rgba(85,132,109,0.10) 290deg 295deg, transparent 295deg 335deg,
        rgba(20,44,74,0.08) 335deg 340deg, transparent 340deg 360deg);
    pointer-events:none;
  }
  .featured .flag{
    display:inline-block;
    font-family:"Spectral", serif;
    text-transform:uppercase;
    letter-spacing:.2em;
    font-size:.68rem;
    color:var(--jade-deep);
    background:rgba(140,198,164,0.14);
    border:1px solid rgba(140,198,164,0.42);
    padding:3px 12px;
    border-radius:3px;
    margin-bottom:12px;
  }
  .featured .proj-title{font-size:1.6rem;}
  .featured .proj-title a{border-bottom:1px dashed var(--jade-deep);}
  .chips{
    display:flex;flex-wrap:wrap;gap:8px;
    margin:14px 0 18px;padding:0;list-style:none;
  }
  .chips li{
    font-family:"Spectral", serif;
    font-size:.78rem;
    letter-spacing:.03em;
    color:var(--navy);
    background:rgba(85,132,109,0.14);
    border:1px solid rgba(85,132,109,0.45);
    padding:4px 11px;
    border-radius:20px;
  }
  .featured .writeup{position:relative;z-index:1;}
  .featured .writeup p{font-size:1em;}

  /* ---------- Projects accordion ---------- */
  .proj-hint{font-style:italic;color:var(--ink-soft);margin:0 0 16px;font-size:.95em;}
  .projects-list{border-top:1px solid var(--line);}
  .proj-item{border-bottom:1px solid var(--line);}
  .proj-toggle{
    width:100%;background:none;border:none;cursor:pointer;color:var(--navy);
    font-family:"Spectral", serif;text-align:left;padding:18px 6px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    transition:color .15s ease;
  }
  .proj-toggle:hover{color:var(--jade-deep);}
  .proj-toggle .tname{font-weight:600;font-size:1.35em;}
  .proj-toggle .thead{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .proj-toggle .tsub{font-style:italic;color:var(--jade-deep);font-size:.8em;font-weight:400;letter-spacing:0;}
  .proj-toggle .featured-pip{
    font-family:"Spectral", serif;text-transform:uppercase;letter-spacing:.16em;
    font-size:.55rem;font-weight:600;color:var(--jade-deep);
    border:1px solid rgba(140,198,164,0.42);background:rgba(140,198,164,0.12);
    padding:2px 8px;border-radius:3px;
  }
  .proj-toggle .tspacer{flex:1;}
  .proj-toggle .tdate{
    font-family:"Spectral", serif;font-size:.8rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;
  }
  .proj-toggle .caret{
    width:.6em;height:.6em;flex:0 0 auto;
    border-right:2px solid var(--rope);border-bottom:2px solid var(--rope);
    transform:rotate(45deg);transition:transform .2s ease;margin-bottom:.15em;
  }
  .proj-item.open .proj-toggle .caret{transform:rotate(-135deg);margin-bottom:-.05em;}
  /* Smooth roll-out/roll-up via animatable grid rows (0fr -> 1fr) */
  .proj-panel{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .38s ease;
  }
  .proj-item.open .proj-panel{grid-template-rows:1fr;}
  .proj-panel .panel-inner{overflow:hidden;min-height:0;}
  .proj-panel .panel-pad{padding:2px 6px 26px;}
  @media (prefers-reduced-motion: reduce){ .proj-panel{transition:none;} }
  .proj-panel .repo-link{display:inline-block;margin-bottom:16px;font-family:"Spectral", serif;font-size:.9em;letter-spacing:.04em;}
  .proj-panel h4{
    font-family:"Spectral", serif;color:var(--navy);font-weight:600;font-size:1.15em;
    margin:22px 0 .3em;border-bottom:2px solid var(--jade);display:inline-block;padding-bottom:2px;
  }
  .proj-panel p{margin:0 0 1em;}
  .proj-panel ul.body-list{margin:.4em 0 1.1em;padding-left:0;list-style:none;}
  .proj-panel ul.body-list li{position:relative;padding-left:24px;margin-bottom:.6em;}
  .proj-panel ul.body-list li::before{
    content:"";position:absolute;left:4px;top:.62em;width:8px;height:8px;
    border:1.5px solid var(--jade-deep);border-radius:50%;
    background:radial-gradient(circle at center, var(--jade) 40%, transparent 42%);
  }
  code{
    font-family:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size:.86em;background:rgba(140,198,164,0.12);
    border:1px solid rgba(140,198,164,0.28);border-radius:4px;
    padding:1px 6px;color:var(--paper);
  }

  /* ---------- Experience as collapsible cards ---------- */
  .exp-list{border-top:none;}
  .exp-list .proj-item{
    border:1px solid var(--line);
    border-radius:6px;
    margin-bottom:16px;
    background:linear-gradient(180deg, var(--parchment-light), var(--parchment-deep));
    box-shadow:0 3px 14px rgba(0,0,0,0.28);
    position:relative;
    overflow:hidden;
  }
  .exp-list .proj-item::after{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--jade);
  }
  .exp-list .proj-toggle{padding:18px 22px 18px 24px;}
  .exp-list .panel-pad{padding:2px 22px 20px 24px;}

  /* ---------- Footer ---------- */
  footer{
    margin-top:60px;
    padding-top:28px;
    border-top:2px solid var(--navy);
    text-align:center;
  }
  footer .compass{
    width:30px;height:30px;margin:0 auto 14px;
    border-radius:50%;
    background:
      conic-gradient(from 0deg, var(--navy) 0 6deg, transparent 6deg 84deg,
        var(--jade) 84deg 96deg, transparent 96deg 174deg,
        var(--navy) 174deg 186deg, transparent 186deg 264deg,
        var(--jade) 264deg 276deg, transparent 276deg 354deg,
        var(--navy) 354deg 360deg);
    border:1.5px solid var(--navy);
  }
  .foot-links{
    display:flex;gap:26px;justify-content:center;flex-wrap:wrap;
    font-family:"Spectral", serif;
    letter-spacing:.1em;
    text-transform:uppercase;
    font-size:.85rem;
  }
  .foot-links a{border-bottom:1px solid var(--jade);}

  /* ---------- Back-to-top button (sized relative to viewport) ---------- */
  .to-top{
    position:fixed;
    right:clamp(16px, 4vw, 34px);
    bottom:clamp(16px, 4vw, 34px);
    width:clamp(52px, 13vw, 60px);
    height:clamp(52px, 13vw, 60px);
    border-radius:50%;
    border:1.5px solid var(--rope);
    background:linear-gradient(180deg, var(--parchment-light), var(--parchment-deep));
    cursor:pointer;
    display:grid;place-items:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.55);
    opacity:0;visibility:hidden;transform:translateY(14px);
    transition:opacity .25s ease, transform .25s ease, visibility .25s ease,
      border-color .15s ease, background .15s ease;
    z-index:60;
  }
  .to-top.show{opacity:1;visibility:visible;transform:translateY(0);}
  .to-top:hover{border-color:var(--jade-deep);}
  .to-top .to-top-arrow{
    width:clamp(12px,3.4vw,15px);
    height:clamp(12px,3.4vw,15px);
    border-left:2.5px solid var(--navy);
    border-top:2.5px solid var(--navy);
    transform:rotate(45deg);
    margin-top:clamp(3px,1vw,5px);
  }
  @media (prefers-reduced-motion: reduce){
    .to-top{transition:opacity .25s ease, visibility .25s ease;transform:none;}
    .to-top.show{transform:none;}
  }

  /* ---------- Responsive ---------- */
  @media (max-width:600px){
    body{font-size:17px;}
    h1{font-size:2.5rem;}
    h2{font-size:1.5rem;}
    .masthead-inner{padding:12px 18px;}
    nav.nav{gap:16px;font-size:.82rem;}
    .wrap{padding:0 18px 70px;}
    .avatar{width:112px;height:112px;font-size:1.6rem;}
    .card,.featured{padding:18px 18px;}
    .dates{white-space:normal;}
  }
</style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a href="#top" class="wordmark" id="wm"><span class="rose" aria-hidden="true"></span><span id="wmText"></span></a>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>

  <main class="wrap" id="top">

    <!-- Bio -->
    <section id="bio">
      <div class="bio-head">
        <div class="avatar" aria-hidden="true">AH</div>
        <h1 id="greeting"></h1>
      </div>
      <div class="logline" id="bioCopy"></div>
    </section>

    <hr class="rope-divider">

    <!-- Present -->
    <section id="present">
      <p class="stage-head">Present</p>
      <div id="presentCopy"></div>
    </section>

    <hr class="wave-divider">

    <!-- Before -->
    <section id="before">
      <p class="stage-head">Before</p>
      <div id="beforeCopy"></div>
      <p class="outro-line" id="beforeOutro"></p>
    </section>

    <hr class="rope-divider">

    <!-- Experience -->
    <section id="experience">
      <p class="kicker">Charted Waters</p>
      <h2>Experience</h2>
      <p class="proj-hint">Select a role to read the details.</p>
      <div id="expCards" class="exp-list"></div>
    </section>

    <hr class="wave-divider">

    <!-- Projects -->
    <section id="projects">
      <p class="kicker">Deck Log</p>
      <h2>Projects</h2>
      <p class="proj-hint">Select a passage to read its full log.</p>
      <div id="projectsList" class="projects-list"></div>
    </section>

    <footer>
      <div class="compass" aria-hidden="true"></div>
      <div class="foot-links" id="footLinks"></div>
    </footer>

  </main>

  <button id="toTop" class="to-top" type="button" aria-label="Back to top" title="Back to top">
    <span class="to-top-arrow" aria-hidden="true"></span>
  </button>

  <script src="content.js"></script>
  <script>
    (function(){
      var S = window.SITE || {};
      var $ = function(id){ return document.getElementById(id); };

      document.title = (S.wordmark || "underway.sh");

      // Header
      $("wmText").textContent = S.wordmark || "";
      var nav = $("nav");
      var anchors = { "Bio":"#bio", "Experience":"#experience", "Projects":"#projects" };
      (S.nav || []).forEach(function(label){
        var a = document.createElement("a");
        a.href = anchors[label] || ("#" + label.toLowerCase());
        a.textContent = label;
        // "Bio" scrolls to the very top of the page, not just the bio section
        if (label === "Bio"){
          a.addEventListener("click", function(e){
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
        }
        nav.appendChild(a);
      });

      // Bio
      $("greeting").textContent = S.greeting || "";
      (S.bio || []).forEach(function(html){
        var p = document.createElement("p");
        p.innerHTML = html;
        $("bioCopy").appendChild(p);
      });

      // Present
      (S.present || []).forEach(function(html){
        var p = document.createElement("p");
        p.innerHTML = html;
        $("presentCopy").appendChild(p);
      });

      // Before
      (S.before || []).forEach(function(html){
        var p = document.createElement("p");
        p.innerHTML = html;
        $("beforeCopy").appendChild(p);
      });
      // Outro: wrap the phrase in an anchor to #projects
      var outro = S.beforeOutro || "";
      var phrase = "please visit my projects section";
      var linked = outro.replace(phrase, '<a href="#projects">' + phrase + '</a>');
      $("beforeOutro").innerHTML = linked;

      // Experience (accordion: click a role to reveal the details)
      var expWrap = $("expCards");
      (S.experience || []).forEach(function(job){
        var item = document.createElement("div");
        item.className = "proj-item";

        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "proj-toggle";
        btn.setAttribute("aria-expanded", "false");

        var thead = document.createElement("span");
        thead.className = "thead";
        var name = document.createElement("span");
        name.className = "tname";
        name.textContent = job.title || "";
        thead.appendChild(name);
        if (job.subtitle || job.location){
          var sub = document.createElement("span");
          sub.className = "tsub";
          var subText = job.subtitle || "";
          if (job.location) subText += (subText ? " · " : "") + job.location;
          sub.textContent = subText;
          thead.appendChild(sub);
        }
        btn.appendChild(thead);

        var spacer = document.createElement("span");
        spacer.className = "tspacer";
        btn.appendChild(spacer);

        var date = document.createElement("span");
        date.className = "tdate";
        date.textContent = job.dates || "";
        btn.appendChild(date);

        var caret = document.createElement("span");
        caret.className = "caret";
        btn.appendChild(caret);

        var panel = document.createElement("div");
        panel.className = "proj-panel";
        var wrap = document.createElement("div");
        wrap.className = "panel-inner";
        var inner = document.createElement("div");
        inner.className = "panel-pad";
        wrap.appendChild(inner);
        panel.appendChild(wrap);
        if (job.bullets && job.bullets.length){
          var ul = document.createElement("ul");
          ul.className = "body-list";
          job.bullets.forEach(function(b){
            var li = document.createElement("li");
            li.innerHTML = b;
            ul.appendChild(li);
          });
          inner.appendChild(ul);
        }

        btn.addEventListener("click", function(){
          var isOpen = item.classList.toggle("open");
          btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
        });

        item.appendChild(btn);
        item.appendChild(panel);
        expWrap.appendChild(item);
      });

      // Projects (accordion: click a title to reveal its full writeup)
      var projects = S.projects || [];
      var list = $("projectsList");
      projects.forEach(function(proj){
        var item = document.createElement("div");
        item.className = "proj-item";

        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "proj-toggle";
        btn.setAttribute("aria-expanded", "false");

        var name = document.createElement("span");
        name.className = "tname";
        name.textContent = proj.title || "";
        btn.appendChild(name);

        if (proj.featured){
          var pip = document.createElement("span");
          pip.className = "featured-pip";
          pip.textContent = "Featured";
          btn.appendChild(pip);
        }

        var spacer = document.createElement("span");
        spacer.className = "tspacer";
        btn.appendChild(spacer);

        var date = document.createElement("span");
        date.className = "tdate";
        date.textContent = proj.dates || "";
        btn.appendChild(date);

        var caret = document.createElement("span");
        caret.className = "caret";
        btn.appendChild(caret);

        var panel = document.createElement("div");
        panel.className = "proj-panel";
        var wrap = document.createElement("div");
        wrap.className = "panel-inner";
        var inner = document.createElement("div");
        inner.className = "panel-pad";
        wrap.appendChild(inner);
        panel.appendChild(wrap);

        if (proj.url){
          var rl = document.createElement("a");
          rl.className = "repo-link";
          rl.href = proj.url;
          rl.target = "_blank";
          rl.rel = "noopener noreferrer";
          rl.textContent = "View repository ↗";
          inner.appendChild(rl);
        }

        if (proj.stack && proj.stack.length){
          var chips = document.createElement("ul");
          chips.className = "chips";
          proj.stack.forEach(function(s){
            var li = document.createElement("li");
            li.textContent = s;
            chips.appendChild(li);
          });
          inner.appendChild(chips);
        }

        (proj.writeup || []).forEach(function(block){
          if (block.sub){
            var h = document.createElement("h4");
            h.textContent = block.sub;
            inner.appendChild(h);
          } else if (block.list){
            var ul = document.createElement("ul");
            ul.className = "body-list";
            block.list.forEach(function(liHtml){
              var li = document.createElement("li");
              li.innerHTML = liHtml;
              ul.appendChild(li);
            });
            inner.appendChild(ul);
          } else if (block.p){
            var p = document.createElement("p");
            p.innerHTML = block.p;
            inner.appendChild(p);
          }
        });

        btn.addEventListener("click", function(){
          var isOpen = item.classList.toggle("open");
          btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
        });

        item.appendChild(btn);
        item.appendChild(panel);
        list.appendChild(item);
      });

      // Footer
      var fl = $("footLinks");
      var foot = S.footer || {};
      if (foot.github){
        var g = document.createElement("a");
        g.href = foot.github; g.textContent = "GitHub";
        g.target = "_blank"; g.rel = "noopener";
        fl.appendChild(g);
      }
      if (foot.linkedin){
        var l = document.createElement("a");
        l.href = foot.linkedin; l.textContent = "LinkedIn";
        l.target = "_blank"; l.rel = "noopener";
        fl.appendChild(l);
      }

      // Back-to-top button: appears once you've scrolled down a bit
      var toTop = $("toTop");
      if (toTop){
        var onScroll = function(){
          if (window.scrollY > 400) toTop.classList.add("show");
          else toTop.classList.remove("show");
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        toTop.addEventListener("click", function(){
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        onScroll();
      }
    })();
  </script>
</body>
</html>
